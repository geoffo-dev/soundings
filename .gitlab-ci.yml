# Soundings CI and continuous delivery for self-managed GitLab.
#
# Stages: lint -> test -> build -> scan -> deploy-test (k3s install/upgrade, e2e), then
# delivery (docs/operator-guide.md "Continuous delivery", ADR 0017): staging -> release ->
# production. Every pipeline builds and scans the image; with SOUNDINGS_DEPLOY set, main
# deploys staging, and a vX.Y.Z tag deploys staging, publishes the release and waits at the
# production gate. Deploys go through the GitLab agent for Kubernetes (no cluster
# credential in GitLab) with scripts/deploy.sh, the script GitHub Actions and people use.
#
# Air-gapped runners: every image is a variable. Point REGISTRY_MIRROR at your Docker Hub
# proxy (e.g. harbor.internal/dockerhub) and set, as CI/CD variables when needed:
#   PIP_INDEX_URL / UV_DEFAULT_INDEX   PyPI mirror        NPM_CONFIG_REGISTRY  npm mirror
#   UBUNTU_MIRROR                       Ubuntu archive mirror (http://mirror.internal/ubuntu)
#                                       for the image's packages and the backend test job
#   CI_BUILD_CA (type File)             extra CA bundle for TLS-intercepting proxies and
#                                       internal CAs (image build, registry, GitLab's agent proxy)
#   TRIVY_DB_REPOSITORY / TRIVY_JAVA_DB_REPOSITORY   mirrors of the Trivy databases
# COSIGN_IMAGE comes from ghcr.io: mirror it too if you sign. The runner's helper image
# defaults to registry.gitlab.com: set helper_image in the runner's config.toml.
# docker:dind (backend tests, deploy-test) pulls postgres/k3s/busybox images itself: give
# the runner's dind a registry mirror (--registry-mirror) or keep them in REGISTRY_MIRROR.
# Keycloak (KEYCLOAK_IMAGE) runs as a service for the backend identity tests and the
# e2e:sso job, Mailpit (MAILPIT_IMAGE) for the backend email tests and both e2e jobs; the
# k3s job's node pulls them through K3S_REGISTRY_MIRROR.
#
# Delivery variables (one table in the operator guide):
#   SOUNDINGS_DEPLOY      environments this CI deploys: "" (checks only), "staging" or
#                         "staging production". One CI per environment, never both.
#   KUBE_AGENT_PROJECT    project holding the agents' config (.gitlab/agents/soundings-<env>/);
#                         jobs use context <KUBE_AGENT_PROJECT>:soundings-<env>
#   STAGING_URL / PRODUCTION_URL   the environments' URLs (the smoke test's target)
#   IMAGE_BUILDER         buildkit (rootless, any Kubernetes runner) or dind (privileged)
#   SCAN_SEVERITY         Trivy gate before any deploy (default HIGH,CRITICAL with a fix)
#   COSIGN_PRIVATE_KEY (File) / COSIGN_PASSWORD   sign the image when set
#   IMAGE_REGISTRY_USER / IMAGE_REGISTRY_PASSWORD credentials when IMAGE_REPOSITORY is
#                         another registry (default: the job token for GitLab's)
#   CD_ONLY               "1" skips the lint, test, e2e and k3s jobs for one pipeline (a
#                         delivery rehearsal: git push -o ci.variable="CD_ONLY=1", or Run
#                         pipeline); release:check, helm:lint, the build and the scan gate
#                         still run. Never set it as a project variable.

stages:
  - lint
  - test
  - build
  - scan
  - deploy-test
  - staging
  - release
  - production

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  REGISTRY_MIRROR: docker.io
  PYTHON_IMAGE: ${REGISTRY_MIRROR}/library/python:3.12-slim
  # The image's base (ADR 0011), pinned; the backend tests run on it too (Ubuntu's
  # Python 3.12 and the Pango stack WeasyPrint needs). Update the digest with the tag.
  UBUNTU_IMAGE: ${REGISTRY_MIRROR}/library/ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
  NODE_IMAGE: ${REGISTRY_MIRROR}/library/node:22-alpine
  POSTGRES_IMAGE: ${REGISTRY_MIRROR}/library/postgres:16-alpine
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.56.1-noble
  DOCKER_IMAGE: ${REGISTRY_MIRROR}/library/docker:28-cli
  DIND_IMAGE: ${REGISTRY_MIRROR}/library/docker:28-dind
  HELM_IMAGE: ${REGISTRY_MIRROR}/alpine/helm:3.16.2
  # Trivy by digest: the March 2026 compromise re-pointed tags (docs/research/github-cd.md).
  TRIVY_IMAGE: ${REGISTRY_MIRROR}/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  # Image builds (kaniko is archived): rootless BuildKit by default, buildx on dind with
  # IMAGE_BUILDER=dind.
  IMAGE_BUILDER: buildkit
  BUILDKIT_IMAGE: ${REGISTRY_MIRROR}/moby/buildkit:v0.33.1-rootless@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
  BUILDKIT_DIND_IMAGE: ${REGISTRY_MIRROR}/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  # Deploy jobs: bash, helm 3, kubectl, curl (alpine/k8s 1.31.13: helm 3.19.0, kubectl
  # 1.31.13). Or your own build of deploy/ci/deploy-runner.Dockerfile --target tools.
  DEPLOY_IMAGE: ${REGISTRY_MIRROR}/alpine/k8s:1.31.13@sha256:7a319b15cfc99c9aaa27ec9891d6b4ca24632b795908591c7b0ba89b03549e0a
  GLAB_IMAGE: ${REGISTRY_MIRROR}/gitlab/glab:v1.122.0@sha256:ca113f949a17d119984884b8937ae7aeff7b471ecaafc6ade015cc9c23707fc9
  COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
  K3S_IMAGE: ${REGISTRY_MIRROR}/rancher/k3s:v1.31.4-k3s1
  KEYCLOAK_IMAGE: ${REGISTRY_MIRROR}/keycloak/keycloak:26.0
  MAILPIT_IMAGE: ${REGISTRY_MIRROR}/axllent/mailpit:v1.31.3
  UV_VERSION: "0.8.17"
  # Where the built image is pushed (defaults to this project's container registry), and
  # the credentials (another registry: protected, masked CI/CD variables).
  IMAGE_REPOSITORY: ${CI_REGISTRY_IMAGE}
  IMAGE_REGISTRY_USER: ${CI_REGISTRY_USER}
  IMAGE_REGISTRY_PASSWORD: ${CI_REGISTRY_PASSWORD}
  # The tag this pipeline's tests run: one per pipeline, never reused. main also pushes
  # sha-<8 hex>, a vX.Y.Z tag X.Y.Z and X.Y (image:build); deploys pin the digest.
  IMAGE_TAG: ci-${CI_PIPELINE_ID}
  # Delivery (see the header): off until SOUNDINGS_DEPLOY names environments.
  SOUNDINGS_DEPLOY: ""
  KUBE_AGENT_PROJECT: ${CI_PROJECT_PATH}
  STAGING_URL: ""
  PRODUCTION_URL: ""
  SCAN_SEVERITY: HIGH,CRITICAL
  SCAN_IGNORE_UNFIXED: "true"
  # "1": no lint/test/e2e/k3s jobs in this pipeline (see the header). Off by default.
  CD_ONLY: ""
  # Caches live in the project dir so GitLab can cache them.
  UV_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/uv
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never
  npm_config_cache: ${CI_PROJECT_DIR}/.cache/npm
  PIP_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/pip

# --- Templates --------------------------------------------------------------------------

# The checks' rules: every lint, test, e2e and k3s job starts with these (CD_ONLY above).
.checks:
  rules:
    - if: $CD_ONLY == "1"
      when: never
    - when: on_success

.ca-bundle: &ca-bundle
  # Trust CI_BUILD_CA (a File variable) in pip/uv/npm/curl when it is set.
  - |
    if [ -n "${CI_BUILD_CA:-}" ] && [ -f "$CI_BUILD_CA" ]; then
      export SSL_CERT_FILE="$CI_BUILD_CA" PIP_CERT="$CI_BUILD_CA" NODE_EXTRA_CA_CERTS="$CI_BUILD_CA" CURL_CA_BUNDLE="$CI_BUILD_CA"
    fi

.backend:
  image: ${PYTHON_IMAGE}
  rules:
    - !reference [.checks, rules]
  cache:
    key:
      files: [backend/uv.lock]
      prefix: backend
    paths: [.cache/uv, .cache/pip]
  before_script:
    - *ca-bundle
    - pip install "uv==${UV_VERSION}"
    - cd backend
    - uv sync --locked

.frontend:
  image: ${NODE_IMAGE}
  rules:
    - !reference [.checks, rules]
  cache:
    key:
      files: [frontend/package-lock.json]
      prefix: frontend
    paths: [.cache/npm]
  before_script:
    - *ca-bundle
    - npm --prefix frontend ci --no-audit --no-fund

.dind:
  services:
    - name: ${DIND_IMAGE}
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2

# --- lint -------------------------------------------------------------------------------

backend:lint:
  extends: .backend
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

backend:typecheck:
  extends: .backend
  stage: lint
  script:
    - uv run mypy

frontend:lint:
  extends: .frontend
  stage: lint
  script:
    - npm --prefix frontend run typecheck
    - npm --prefix frontend run lint

# The generated API contract must match the backend: `make gen-api` leaves no diff. Split
# in two because no single image has both Python/uv and Node: the backend's OpenAPI export
# must equal the committed openapi.json, and the TypeScript types generated from that file
# must equal the committed schema.d.ts.
contract:openapi:
  extends: .backend
  stage: lint
  script:
    - uv run soundings openapi --output /tmp/openapi.json
    - |
      diff -u ../frontend/src/api/generated/openapi.json /tmp/openapi.json || {
        echo "frontend/src/api/generated/openapi.json is stale: run 'make gen-api' and commit it"
        exit 1
      }

contract:types:
  extends: .frontend
  stage: lint
  script:
    - cp frontend/src/api/generated/schema.d.ts /tmp/schema.d.ts
    - npm --prefix frontend run gen:api
    - |
      diff -u /tmp/schema.d.ts frontend/src/api/generated/schema.d.ts || {
        echo "frontend/src/api/generated/schema.d.ts is stale: run 'make gen-api' and commit it"
        exit 1
      }

# The fake kagent agent (dev/fake-agent, dev and CI only): ruff, mypy --strict, pytest,
# including a2a-sdk 0.3.23's own client (kagent-adk 0.10.2's A2A library) against it.
fake-agent:test:
  stage: test
  image: ${PYTHON_IMAGE}
  rules:
    - !reference [.checks, rules]
  cache:
    key:
      files: [dev/fake-agent/uv.lock]
      prefix: fake-agent
    paths: [.cache/uv, .cache/pip]
  before_script:
    - *ca-bundle
    - pip install "uv==${UV_VERSION}"
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null
  script:
    - make -C dev/fake-agent install check

helm:lint:
  stage: lint
  image:
    name: ${HELM_IMAGE}
    entrypoint: [""]
  script:
    # helm lint validates values against values.schema.json; helm template also runs
    # the chart's own `fail` checks, which lint only reports as INFO.
    - helm lint --strict deploy/helm
    - |
      for values in deploy/helm/ci/*-values.yaml; do
        echo "--- $values"
        helm lint --strict deploy/helm -f "$values"
        helm template ci deploy/helm -f "$values" > /dev/null
      done
    # The schema must reject invalid values.
    - |
      for bad in "smtp.security=ssl" "logLevel=verbose" "unknownKey=1" "baseUrls[0]=ftp://x" \
                 "metrics.port=8000" "sessions.idleTimeout=12h" "demo.seed=true" \
                 "oidc.issuer=https://idp/realms/a?x=1" "oidc.externalIdKind=Bad-Kind" \
                 "oidc.issuer=https://idp/realms/a" \
                 "oidc.issuer=http://idp/realms/a,oidc.clientSecret=s,baseUrls[0]=https://a.example" \
                 "oidc.issuer=https://idp/realms/a,oidc.clientSecret=s" \
                 "oidc.issuer=https://idp/r,oidc.clientSecret=s,baseUrls[0]=https://a.example,oidc.externalIdClaim=https://x/emp-no" \
                 "smtp.host=smtp.example.com" "smtp.host=smtp.example.com:25,smtp.from=a@example.com" \
                 "smtp.host=s.example.com,smtp.from=not-an-address" \
                 "smtp.host=s.example.com,smtp.from=a@example.com,smtp.security=none,smtp.password=p" \
                 "smtp.host=s.example.com,smtp.from=a@example.com,smtp.existingSecret=x,smtp.username=u" \
                 "smtp.port=70000" "smtp.timeout=0" "timezone=Europe/London;x" \
                 "notifications.digestHour=24" "notifications.reminderDays={1,1}" \
                 "notifications.reminderDays={31}" "networkPolicy.egress.smtp.port=0" \
                 "publicSubmission.perIpPerHour=0" "publicSubmission.perProjectPerHour=20000" \
                 "publicSubmission.altcha.cost=10" "publicSubmission.altcha.expiry=30m" \
                 "branding.maxUploadBytes=1048576" "ingress.publicApi.foo=1"; do
        if helm template ci deploy/helm --set "$bad" > /dev/null 2>&1; then
          echo "chart accepted invalid value: $bad"; exit 1
        fi
      done

# --- test -------------------------------------------------------------------------------

backend:test:
  extends: [.backend, .dind]
  stage: test
  # The runtime image's OS and interpreter (ADR 0011): Ubuntu 24.04, /usr/bin/python3.12,
  # and the Pango stack, so the PDF export tests render as the image does.
  image: ${UBUNTU_IMAGE}
  before_script:
    - *ca-bundle
    - |
      export DEBIAN_FRONTEND=noninteractive
      if [ -n "${UBUNTU_MIRROR:-}" ]; then
        sed -i -E "s#https?://(archive|security|ports)\.ubuntu\.com/ubuntu(-ports)?/?#${UBUNTU_MIRROR%/}/#g" \
          /etc/apt/sources.list.d/ubuntu.sources
      fi
      apt_ca=""
      if [ -n "${CI_BUILD_CA:-}" ] && [ -f "$CI_BUILD_CA" ]; then apt_ca="-o Acquire::https::CaInfo=$CI_BUILD_CA"; fi
      apt-get $apt_ca update -qq
      apt-get $apt_ca install -y -qq --no-install-recommends python3.12 python3.12-venv \
        libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fontconfig fonts-dejavu-core \
        ca-certificates tzdata >/dev/null
    - python3.12 -m venv /opt/uv && /opt/uv/bin/pip install -q "uv==${UV_VERSION}"
    - export PATH="/opt/uv/bin:$PATH" UV_PYTHON=/usr/bin/python3.12
    - cd backend
    - uv sync --locked
  # dind for testcontainers (Postgres), and Keycloak 26 for the identity integration
  # tests (tests/identity/test_keycloak.py: the real code flow, group sync and the SPEC
  # acceptance). The service can't read the repository, so the dev realm is loaded
  # through the admin API before the tests (dev/keycloak/import_realm.py).
  services:
    - name: ${DIND_IMAGE}
      alias: docker
      command: ["--tls=false"]
    - name: ${KEYCLOAK_IMAGE}
      alias: keycloak
      command: ["start-dev"]
      variables:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        # The issuer follows the URL used: http://keycloak:8080 for tests and app alike.
        KC_HOSTNAME_STRICT: "false"
        KC_LOG_LEVEL: warn
    # Mailpit for the email tests that talk to a real SMTP server.
    - name: ${MAILPIT_IMAGE}
      alias: mailpit
      variables:
        MP_SMTP_AUTH_ACCEPT_ANY: "true"
        MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        MP_DISABLE_VERSION_CHECK: "true"
  variables:
    # testcontainers talks to the dind service; published ports live on that host.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # The dind daemon is thrown away with the job, so the reaper container is not needed.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    # Use the service instead of a testcontainers Keycloak; the tests fail (not skip)
    # when it doesn't answer.
    SOUNDINGS_TEST_KEYCLOAK_URL: http://keycloak:8080
    SOUNDINGS_TEST_MAILPIT_URL: http://mailpit:8025
    SOUNDINGS_TEST_MAILPIT_SMTP: mailpit:1025
  script:
    - python3.12 ../dev/keycloak/import_realm.py http://keycloak:8080 --origin http://testserver
    - uv run pytest -p no:cacheprovider --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml

frontend:test:
  extends: .frontend
  stage: test
  script:
    - npm --prefix frontend run test

frontend:build:
  extends: .frontend
  stage: test
  script:
    - npm --prefix frontend run build
  artifacts:
    expire_in: 1 day
    paths: [frontend/dist]

# --- build ------------------------------------------------------------------------------

# Every pipeline pushes $IMAGE_TAG (ci-<pipeline id>) for its tests; main also pushes
# sha-<8 hex> and a vX.Y.Z tag X.Y.Z and X.Y, all in one push of one digest. image.env (a
# dotenv report kept forever, so a re-run deploy job still finds it) carries IMAGE_DIGEST,
# IMAGE_REF (repository@digest), DEPLOY_TAG and RELEASE_VERSION to later jobs.
.image-names: &image-names
  - |
    registry="${IMAGE_REPOSITORY%%/*}"
    mkdir -p "$HOME/.docker"
    printf '{"auths":{"%s":{"auth":"%s"}}}' "$registry" \
      "$(printf '%s:%s' "$IMAGE_REGISTRY_USER" "$IMAGE_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
      > "$HOME/.docker/config.json"
    names="$IMAGE_REPOSITORY:$IMAGE_TAG"
    deploy_tag="$IMAGE_TAG"
    version="$CI_COMMIT_SHORT_SHA"
    release_version=""
    if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
      deploy_tag="sha-$CI_COMMIT_SHORT_SHA"
      names="$names,$IMAGE_REPOSITORY:$deploy_tag"
    fi
    if printf '%s' "${CI_COMMIT_TAG:-}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
      release_version="${CI_COMMIT_TAG#v}"
      deploy_tag="$release_version"
      version="$release_version"
      names="$names,$IMAGE_REPOSITORY:$release_version,$IMAGE_REPOSITORY:${release_version%.*}"
    fi
    echo "pushing $names (version $version)"

.image-env: &image-env
  - |
    digest="$(sed -n 's/.*"containerimage\.digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' build-meta.json | head -n 1)"
    [ -n "$digest" ] || { echo "no image digest in build-meta.json"; cat build-meta.json; exit 1; }
    printf 'IMAGE_DIGEST=%s\nIMAGE_REF=%s@%s\nDEPLOY_TAG=%s\nRELEASE_VERSION=%s\n' \
      "$digest" "$IMAGE_REPOSITORY" "$digest" "$deploy_tag" "$release_version" | tee image.env

.image-build:
  stage: build
  artifacts:
    expire_in: never
    reports:
      dotenv: image.env

# Rootless BuildKit (no privileged container): the runner must let the build container
# unshare (Kubernetes executor: seccomp and AppArmor "Unconfined" for the build container;
# Ubuntu 24.04 nodes: kernel.apparmor_restrict_unprivileged_userns=0). Operator guide,
# "Image builds on your runners".
image:build:
  extends: .image-build
  image:
    name: ${BUILDKIT_IMAGE}
    entrypoint: [""]
  rules:
    - if: $IMAGE_BUILDER == "dind"
      when: never
    - when: on_success
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - *image-names
    - |
      set -- --opt "build-arg:VERSION=$version" \
             --opt "build-arg:VCS_REF=$CI_COMMIT_SHORT_SHA" \
             --opt "build-arg:BUILD_DATE=$CI_JOB_STARTED_AT" \
             --opt "build-arg:SOURCE_URL=$CI_PROJECT_URL" \
             --opt "build-arg:UBUNTU_IMAGE=$UBUNTU_IMAGE" \
             --opt "build-arg:NODE_IMAGE=$NODE_IMAGE"
      for arg in NPM_CONFIG_REGISTRY PIP_INDEX_URL UV_DEFAULT_INDEX UBUNTU_MIRROR; do
        eval "value=\${$arg:-}"
        [ -z "$value" ] || set -- "$@" --opt "build-arg:$arg=$value"
      done
      if [ -n "${CI_BUILD_CA:-}" ] && [ -f "$CI_BUILD_CA" ]; then
        # The Dockerfile's build_ca secret, and BuildKit's own trust for the registry (the
        # rootless image has no system CA store).
        set -- "$@" --secret "id=build_ca,src=$CI_BUILD_CA"
        mkdir -p "$HOME/.config/buildkit"
        printf '[registry."%s"]\n  ca = ["%s"]\n' "$registry" "$CI_BUILD_CA" > "$HOME/.config/buildkit/buildkitd.toml"
        export SSL_CERT_FILE="$CI_BUILD_CA"
      fi
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 --local context=. --local dockerfile=. "$@" \
        --import-cache "type=registry,ref=$IMAGE_REPOSITORY/cache:buildkit" \
        --export-cache "type=registry,ref=$IMAGE_REPOSITORY/cache:buildkit,mode=max" \
        --output "type=image,\"name=$names\",push=true" \
        --metadata-file build-meta.json
    - *image-env

# The same with docker buildx on a privileged Docker runner's dind service
# (IMAGE_BUILDER=dind). The builder container (BUILDKIT_DIND_IMAGE) exports the same cache.
image:build:dind:
  extends: [.image-build, .dind]
  image: ${DOCKER_IMAGE}
  rules:
    - if: $IMAGE_BUILDER == "dind"
  script:
    - *image-names
    - |
      config=""
      set -- --build-arg "VERSION=$version" \
             --build-arg "VCS_REF=$CI_COMMIT_SHORT_SHA" \
             --build-arg "BUILD_DATE=$CI_JOB_STARTED_AT" \
             --build-arg "SOURCE_URL=$CI_PROJECT_URL" \
             --build-arg "UBUNTU_IMAGE=$UBUNTU_IMAGE" \
             --build-arg "NODE_IMAGE=$NODE_IMAGE"
      for arg in NPM_CONFIG_REGISTRY PIP_INDEX_URL UV_DEFAULT_INDEX UBUNTU_MIRROR; do
        eval "value=\${$arg:-}"
        [ -z "$value" ] || set -- "$@" --build-arg "$arg=$value"
      done
      if [ -n "${CI_BUILD_CA:-}" ] && [ -f "$CI_BUILD_CA" ]; then
        set -- "$@" --secret "id=build_ca,src=$CI_BUILD_CA"
        # The builder container (buildx copies the CA into it) trusts it for the registry it
        # pushes to and for the base images' registries (an internal mirror); this client
        # trusts it for the registries' token endpoints (GitLab: /jwt/auth on GitLab's host),
        # which BuildKit reaches through the client.
        hosts="$registry"
        for ref in "$UBUNTU_IMAGE" "$NODE_IMAGE"; do
          host="${ref%%/*}"
          case "$host" in *.* | *:* | localhost) ;; *) host=docker.io ;; esac
          case " $hosts " in *" $host "*) ;; *) hosts="$hosts $host" ;; esac
        done
        for host in $hosts; do printf '[registry."%s"]\n  ca = ["%s"]\n' "$host" "$CI_BUILD_CA"; done > buildkitd.toml
        config="--config buildkitd.toml"
        export SSL_CERT_FILE="$CI_BUILD_CA"
      fi
      for name in $(printf '%s' "$names" | tr ',' ' '); do set -- "$@" --tag "$name"; done
      # network=host: the builder shares the dind service's network and so its resolver.
      # On its own bridge it would fall back to 8.8.8.8 whenever the service resolves names
      # through Docker's embedded DNS (network_mode, FF_NETWORK_PER_BUILD), which an air-gapped
      # network can't reach: the registry and the mirror would not resolve.
      # shellcheck disable=SC2086
      docker buildx create --name soundings --driver docker-container \
        --driver-opt "image=$BUILDKIT_DIND_IMAGE" --driver-opt network=host $config --use
      docker buildx build --push --provenance=false "$@" \
        --cache-from "type=registry,ref=$IMAGE_REPOSITORY/cache:buildkit" \
        --cache-to "type=registry,ref=$IMAGE_REPOSITORY/cache:buildkit,mode=max" \
        --metadata-file build-meta.json .
    - *image-env

# A vX.Y.Z tag must match the versions in the repository: the app reports
# backend/pyproject.toml's version, the chart carries deploy/helm/Chart.yaml's.
release:check:
  stage: lint
  image:
    name: ${HELM_IMAGE}
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - scripts/deploy.sh check-release "$CI_COMMIT_TAG"

# --- scan -------------------------------------------------------------------------------

# The gate before any deploy, on the pushed digest: SCAN_SEVERITY (default HIGH,CRITICAL)
# fails the pipeline; SCAN_IGNORE_UNFIXED=true (default) skips findings without a fix.
# Also the CycloneDX SBOM that the release carries.
image:trivy:
  stage: scan
  image:
    name: ${TRIVY_IMAGE}
    entrypoint: [""]
  needs:
    - job: image:build
      optional: true
    - job: image:build:dind
      optional: true
  variables:
    TRIVY_USERNAME: ${IMAGE_REGISTRY_USER}
    TRIVY_PASSWORD: ${IMAGE_REGISTRY_PASSWORD}
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ${CI_PROJECT_DIR}/.cache/trivy
  cache:
    key: trivy
    paths: [.cache/trivy]
  before_script:
    - *ca-bundle
  script:
    # Full report for the merge request widget...
    - trivy image --exit-code 0 --format template --template "@/contrib/gitlab.tpl"
        --output gl-container-scanning-report.json "$IMAGE_REF"
    # ...the SBOM...
    - trivy image --format cyclonedx --output "soundings-${RELEASE_VERSION:-$DEPLOY_TAG}.cdx.json" "$IMAGE_REF"
    # ...and the gate.
    - |
      unfixed=""
      [ "$SCAN_IGNORE_UNFIXED" != "true" ] || unfixed="--ignore-unfixed"
      # shellcheck disable=SC2086
      trivy image --exit-code 1 $unfixed --severity "$SCAN_SEVERITY" "$IMAGE_REF"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [soundings-*.cdx.json]
    reports:
      container_scanning: gl-container-scanning-report.json

# Optional: sign the digest with a key (keyless needs Sigstore on the internet). Runs when
# COSIGN_PRIVATE_KEY (a protected File variable) is set; COSIGN_PASSWORD unlocks it. Verify
# with: cosign verify --key cosign.pub --insecure-ignore-tlog=true <repository>@<digest>.
image:sign:
  stage: scan
  image:
    name: ${COSIGN_IMAGE}
    entrypoint: [""]
  needs:
    - job: image:trivy
      artifacts: false
    - job: image:build
      optional: true
    - job: image:build:dind
      optional: true
  rules:
    - if: $COSIGN_PRIVATE_KEY && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/)
  before_script:
    - *ca-bundle
  script:
    - |
      registry="${IMAGE_REPOSITORY%%/*}"
      mkdir -p "$HOME/.docker"
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$registry" \
        "$(printf '%s:%s' "$IMAGE_REGISTRY_USER" "$IMAGE_REGISTRY_PASSWORD" | base64 | tr -d '\n')" \
        > "$HOME/.docker/config.json"
    - cosign sign --yes --key "$COSIGN_PRIVATE_KEY" --use-signing-config=false --tlog-upload=false "$IMAGE_REF"

# --- deploy-test ------------------------------------------------------------------------

# Playwright end-to-end tests (e2e/, qa) against the image just built: Postgres, Mailpit
# and the app run as services, the app migrated and seeded with the demo data and the dev
# login on, and its worker (email, reminders, digests) running next to the API in the
# same service. The tests get the app's URL in E2E_BASE_URL and Mailpit's API in
# E2E_MAILPIT_URL; services can't be stopped, so the SMTP-outage specs skip here (the
# local stack and the k3s job's email smoke cover them).
e2e:
  stage: deploy-test
  image: ${PLAYWRIGHT_IMAGE}
  needs:
    - job: image:build
      optional: true
    - job: image:build:dind
      optional: true
  rules:
    - if: $CD_ONLY == "1"
      when: never
    - exists: [e2e/package.json]
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
    - name: ${MAILPIT_IMAGE}
      alias: mailpit
      variables:
        MP_SMTP_AUTH_ACCEPT_ANY: "true"
        MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        MP_DISABLE_VERSION_CHECK: "true"
    - name: ${IMAGE_REPOSITORY}:${IMAGE_TAG}
      alias: app
      entrypoint: ["sh", "-c"]
      command:
        - soundings wait-for-db --timeout 120 && soundings migrate && soundings seed && { soundings worker & exec soundings api; }
  variables:
    # Services reach each other by alias (the app talks to postgres).
    FF_NETWORK_PER_BUILD: "true"
    POSTGRES_DB: soundings
    POSTGRES_USER: soundings
    POSTGRES_PASSWORD: soundings
    SOUNDINGS_DATABASE_URL: postgresql+psycopg://soundings:soundings@postgres:5432/soundings
    SOUNDINGS_ENVIRONMENT: development
    SOUNDINGS_DEV_LOGIN_ENABLED: "true"
    SOUNDINGS_BASE_URLS: http://app:8000
    # Email to Mailpit, dates in the browser's zone (as in e2e/scripts/stack-env.sh).
    SOUNDINGS_SMTP_HOST: mailpit
    SOUNDINGS_SMTP_PORT: "1025"
    SOUNDINGS_SMTP_SECURITY: none
    SOUNDINGS_SMTP_FROM: soundings@example.com
    SOUNDINGS_TIMEZONE: Europe/London
    E2E_MAILPIT_URL: http://mailpit:8025
    # Every spec sends the public form from this job's address (as in the local stack).
    SOUNDINGS_PUBLIC_SUBMISSIONS_PER_IP: "1000"
    SOUNDINGS_SESSION_WRITES_PER_MINUTE: "100000"
    # The break-glass admin, as in the local e2e stack (e2e/scripts/stack-env.sh).
    SOUNDINGS_BREAK_GLASS_ENABLED: "true"
    SOUNDINGS_BREAK_GLASS_USERNAME: admin
    SOUNDINGS_BREAK_GLASS_PASSWORD: e2e-break-glass-password
    E2E_BASE_URL: http://app:8000
  cache:
    key:
      files: [e2e/package-lock.json]
      prefix: e2e
    paths: [.cache/npm]
  before_script:
    - *ca-bundle
    - npm --prefix e2e ci --no-audit --no-fund
    # Wait (up to 3 minutes) for the app to have migrated, seeded and started.
    - |
      node -e '
        const url = process.env.E2E_BASE_URL + "/readyz";
        const deadline = Date.now() + 180000;
        (async () => {
          for (;;) {
            try { if ((await fetch(url)).ok) { console.log("app ready:", url); return; } } catch {}
            if (Date.now() > deadline) { console.error("app not ready:", url); process.exit(1); }
            await new Promise((resolve) => setTimeout(resolve, 2000));
          }
        })();'
  script:
    - npm --prefix e2e run test
  artifacts:
    when: always
    expire_in: 1 week
    paths: [e2e/playwright-report, e2e/test-results]


# The same against single sign-on: Keycloak 26 as a service with the dev realm (loaded
# through the admin API: services can't read the repository), the app configured for
# it, and the specs tagged @sso (QA). Issuer http://keycloak:8080/realms/soundings for
# the browser (this job) and the app alike. Keycloak sets its cookies without Secure on
# a plain-http non-localhost origin, so Chromium needs no flags.
e2e:sso:
  stage: deploy-test
  image: ${PLAYWRIGHT_IMAGE}
  needs:
    - job: image:build
      optional: true
    - job: image:build:dind
      optional: true
  rules:
    - if: $CD_ONLY == "1"
      when: never
    - exists: [e2e/package.json]
  services:
    - name: ${POSTGRES_IMAGE}
      alias: postgres
    - name: ${KEYCLOAK_IMAGE}
      alias: keycloak
      command: ["start-dev"]
      variables:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        KC_HOSTNAME_STRICT: "false"
        KC_LOG_LEVEL: warn
    - name: ${MAILPIT_IMAGE}
      alias: mailpit
      variables:
        MP_SMTP_AUTH_ACCEPT_ANY: "true"
        MP_SMTP_AUTH_ALLOW_INSECURE: "true"
        MP_DISABLE_VERSION_CHECK: "true"
    - name: ${IMAGE_REPOSITORY}:${IMAGE_TAG}
      alias: app
      entrypoint: ["sh", "-c"]
      command:
        - soundings wait-for-db --timeout 120 && soundings migrate && soundings seed && { soundings worker & exec soundings api; }
  variables:
    FF_NETWORK_PER_BUILD: "true"
    POSTGRES_DB: soundings
    POSTGRES_USER: soundings
    POSTGRES_PASSWORD: soundings
    SOUNDINGS_DATABASE_URL: postgresql+psycopg://soundings:soundings@postgres:5432/soundings
    SOUNDINGS_ENVIRONMENT: development
    SOUNDINGS_DEV_LOGIN_ENABLED: "true"
    SOUNDINGS_BASE_URLS: http://app:8000
    SOUNDINGS_OIDC_ISSUER: http://keycloak:8080/realms/soundings
    SOUNDINGS_OIDC_CLIENT_ID: soundings
    SOUNDINGS_OIDC_CLIENT_SECRET: soundings-dev-secret
    SOUNDINGS_OIDC_GROUPS_CLAIM: groups
    SOUNDINGS_OIDC_EXTERNAL_ID_CLAIM: employee_no
    SOUNDINGS_SMTP_HOST: mailpit
    SOUNDINGS_SMTP_PORT: "1025"
    SOUNDINGS_SMTP_SECURITY: none
    SOUNDINGS_SMTP_FROM: soundings@example.com
    SOUNDINGS_TIMEZONE: Europe/London
    SOUNDINGS_PUBLIC_SUBMISSIONS_PER_IP: "1000"
    SOUNDINGS_SESSION_WRITES_PER_MINUTE: "100000"
    E2E_MAILPIT_URL: http://mailpit:8025
    E2E_BASE_URL: http://app:8000
    E2E_SSO: "1"
    E2E_KC_URL: http://keycloak:8080
    # Which specs need SSO: Playwright --grep (QA tags them @sso).
    E2E_SSO_GREP: "@sso"
  cache:
    key:
      files: [e2e/package-lock.json]
      prefix: e2e
    paths: [.cache/npm]
  before_script:
    - *ca-bundle
    - npm --prefix e2e ci --no-audit --no-fund
    - node --experimental-strip-types e2e/scripts/keycloak.ts wait 180 master
    - node --experimental-strip-types e2e/scripts/keycloak.ts reset-realm "$E2E_BASE_URL"
  script:
    - npm --prefix e2e run test -- --grep "$E2E_SSO_GREP"
  artifacts:
    when: always
    expire_in: 1 week
    paths: [e2e/playwright-report, e2e/test-results]

# Install, upgrade and smoke-test the chart on k3s running in docker:dind, with the same
# scripts as local development (scripts/k3s-*.sh), in a namespace that enforces the
# Restricted Pod Security Standard. Also exercises the external-database path, single
# sign-on through the ingress against Keycloak in the cluster, email to Mailpit in
# the cluster with egress NetworkPolicies (an invited evaluator's email; an SMTP outage
# while Mailpit is scaled to 0, then delivery once it is back), and the MCP server
# through the ingress and from another namespace (API keys, tools, revoke), and AI
# assistance against Soundings' fake kagent agent in kagent's place with kagent v0.10.2's
# CRDs (the example agents validated and created; an AI evaluation end to end).
k3s:install-upgrade:
  extends: .dind
  stage: deploy-test
  image: ${DOCKER_IMAGE}
  rules:
    - !reference [.checks, rules]
  needs:
    - job: image:build
      optional: true
    - job: image:build:dind
      optional: true
    - helm:lint
  variables:
    K3S_NAME: soundings-ci
    K3S_BIND_ADDRESS: 0.0.0.0
    K3S_CONNECT_HOST: docker
    # Set to your Docker Hub mirror, or "" when the dind daemon can reach Docker Hub.
    K3S_REGISTRY_MIRROR: https://mirror.gcr.io
  before_script:
    - *ca-bundle
    - export K3S_EXTRA_CA="${CI_BUILD_CA:-}"
    # docker:cli is Alpine without bash/curl; use an image that has them when offline.
    - command -v bash >/dev/null && command -v curl >/dev/null && command -v jq >/dev/null ||
      apk add --no-cache bash curl tar jq git make
    - echo "$IMAGE_REGISTRY_PASSWORD" | docker login -u "$IMAGE_REGISTRY_USER" --password-stdin "${IMAGE_REPOSITORY%%/*}"
    - docker pull "$IMAGE_REPOSITORY:$IMAGE_TAG"
    - docker tag "$IMAGE_REPOSITORY:$IMAGE_TAG" soundings:ci
    # The fake kagent agent's image (dev/fake-agent), built here: tests only, never pushed.
    - |
      ca_flag=""
      if [ -n "${CI_BUILD_CA:-}" ] && [ -f "$CI_BUILD_CA" ]; then ca_flag="--secret id=build_ca,src=$CI_BUILD_CA"; fi
      docker build $ca_flag ${PIP_INDEX_URL:+--build-arg PIP_INDEX_URL=$PIP_INDEX_URL} \
        ${UV_DEFAULT_INDEX:+--build-arg UV_DEFAULT_INDEX=$UV_DEFAULT_INDEX} \
        --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" -t soundings-fake-agent:ci dev/fake-agent
  script:
    - scripts/k3s-up.sh
    - scripts/k3s-load-image.sh soundings:ci
    # dev/k3s-values.yaml: dev login and the demo seed hook Job (smoke-tested below).
    - scripts/k3s-install.sh --set image.tag=ci
    - scripts/k3s-smoke.sh
    # Upgrade: a config change (rolls every pod) and a second API replica.
    - scripts/k3s-install.sh --set image.tag=ci --set logLevel=DEBUG --set api.replicas=2
    - scripts/k3s-smoke.sh
    # Single sign-on: Keycloak with the dev realm in the cluster, the release pointed at
    # it, and the acceptance through the ingress (sso-smoke.sh via k3s-smoke.sh).
    - scripts/k3s-keycloak.sh
    - SSO=1 scripts/k3s-install.sh --set image.tag=ci
    - SSO=1 scripts/k3s-smoke.sh
    # Email: Mailpit in the cluster, SMTP and egress policies on top of SSO. MCP: the API
    # admits only Traefik and kagent's namespace; a key through the ingress (acceptance,
    # revoke -> 401) and an MCP SDK client in a pod of namespace kagent (mcp-smoke.sh).
    # AI: kagent v0.10.2's CRDs (git tag; the example manifests dry-run against them) and
    # the fake kagent as kagent/kagent-controller:8083; the release with features.ai,
    # egress policies and kagent.examples, then ai-smoke.sh through the ingress.
    - scripts/k3s-mailpit.sh
    - scripts/k3s-kagent-crds.sh install
    - FAKE_AGENT_IMAGE=soundings-fake-agent:ci scripts/k3s-fake-agent.sh
    - SSO=1 SMTP=1 MCP=1 AI=1 scripts/k3s-install.sh --set image.tag=ci
    - SSO=1 SMTP=1 MCP=1 AI=1 scripts/k3s-smoke.sh
    - IMAGE_TAG=ci scripts/k3s-test-external-db.sh
  after_script:
    - scripts/k3s-down.sh || true

# --- delivery: staging -> release -> production -----------------------------------------
#
# Deploy jobs exist only for the environments SOUNDINGS_DEPLOY names (one CI per
# environment). They reach the cluster through the GitLab agent for Kubernetes: GitLab
# injects a kubeconfig whose context <KUBE_AGENT_PROJECT>:soundings-<env> works only for
# this job, through the agent's own connection out of the cluster; the agents' ci_access
# (.gitlab/agents/) lets only jobs of that environment (production: on protected refs)
# use it, and the agent's ServiceAccount may act only in soundings-<env>
# (deploy/gitlab-agent/rbac.yaml). Any runner that reaches GitLab can deploy; GitLab must
# serve https (the agent proxy's credentials only travel over TLS: CI_BUILD_CA for an
# internal CA). resource_group runs one deploy per environment at a time; also turn on
# "Prevent outdated deployment jobs" (Settings > CI/CD > General pipelines).
.deploy:
  image:
    name: ${DEPLOY_IMAGE}
    entrypoint: [""]
  before_script:
    - *ca-bundle
    # The runner writes file variables world-readable; Helm warns on every call otherwise.
    - '[ -z "${KUBECONFIG:-}" ] || chmod 600 "$KUBECONFIG"'
    - |
      # With the agents configured in this project, its ci_access must name the project
      # itself: otherwise implicit access lets every job here use the agent, on any branch.
      config=".gitlab/agents/soundings-$CI_ENVIRONMENT_NAME/config.yaml"
      if [ "$KUBE_AGENT_PROJECT" = "$CI_PROJECT_PATH" ] &&
        ! grep -Eq "^[[:space:]]*-[[:space:]]+id:[[:space:]]+\"?$CI_PROJECT_PATH\"?[[:space:]]*$" "$config"; then
        echo "$config must list this project ($CI_PROJECT_PATH) under ci_access.projects (docs/operator-guide.md, Continuous delivery)"
        exit 1
      fi

# The checks this deploy waits for are its needs (a new check job belongs here too).
.deploy-needs: &deploy-needs
  - job: image:build
    optional: true
  - job: image:build:dind
    optional: true
  - job: image:trivy
    artifacts: false
  - job: e2e
    optional: true
    artifacts: false
  - job: e2e:sso
    optional: true
    artifacts: false
  - job: k3s:install-upgrade
    optional: true # always in the pipeline, except with CD_ONLY
    artifacts: false

# main: every push; a vX.Y.Z tag: the release image first goes to staging.
deploy:staging:
  extends: .deploy
  stage: staging
  needs: *deploy-needs
  rules:
    - if: $SOUNDINGS_DEPLOY =~ /\bstaging\b/ && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $SOUNDINGS_DEPLOY =~ /\bstaging\b/ && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  environment:
    name: staging
    url: $STAGING_URL
    deployment_tier: staging
  resource_group: staging
  variables:
    KUBE_CONTEXT: ${KUBE_AGENT_PROJECT}:soundings-staging
    DEPLOY_URL: ${STAGING_URL}
  script:
    - IMAGE_TAG="$DEPLOY_TAG" scripts/deploy.sh deploy staging
    # What production deploys after the gate: exactly this digest.
    - printf 'STAGED_IMAGE_DIGEST=%s\nSTAGED_IMAGE_TAG=%s\n' "$IMAGE_DIGEST" "$DEPLOY_TAG" > staged.env
  artifacts:
    expire_in: never
    reports:
      dotenv: staged.env

# A manual rollback of staging to the revision before the current one (or
# ROLLBACK_REVISION, set when running the job). Refused across a migration boundary unless
# DEPLOY_FORCE=1 (operator guide, "Rollback"). Available in every main pipeline at once.
rollback:staging:
  extends: .deploy
  stage: staging
  needs: []
  rules:
    - if: $SOUNDINGS_DEPLOY =~ /\bstaging\b/ && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/)
      when: manual
      allow_failure: true
  environment:
    name: staging
    action: access
  resource_group: staging
  variables:
    KUBE_CONTEXT: ${KUBE_AGENT_PROJECT}:soundings-staging
    DEPLOY_URL: ${STAGING_URL}
  script:
    - scripts/deploy.sh rollback staging

# The chart, packaged with the release's version (it already matches: release:check).
chart:package:
  stage: release
  image:
    name: ${HELM_IMAGE}
    entrypoint: [""]
  needs:
    - job: release:check
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - version="${CI_COMMIT_TAG#v}"
    - helm package deploy/helm --version "$version" --app-version "$version" --destination .
  artifacts:
    expire_in: 30 days
    paths: [soundings-*.tgz]

# The GitLab release for a vX.Y.Z tag, once its image passed the scan and (when this CI
# deploys it) staging: the SBOM and the chart as assets in the generic package registry,
# the image's digest in the notes.
release:publish:
  stage: release
  image:
    name: ${GLAB_IMAGE}
    entrypoint: [""]
  needs:
    - job: image:build
      optional: true
    - job: image:build:dind
      optional: true
    - job: image:trivy
    - job: chart:package
    - job: deploy:staging
      optional: true
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    GITLAB_HOST: ${CI_SERVER_URL}
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  before_script:
    - *ca-bundle
  script:
    - |
      glab release create "$CI_COMMIT_TAG" \
        "soundings-$RELEASE_VERSION.cdx.json" "soundings-$RELEASE_VERSION.tgz" \
        --name "Soundings $RELEASE_VERSION" --use-package-registry \
        --notes "Image: \`$IMAGE_REPOSITORY:$RELEASE_VERSION\` (\`$IMAGE_REF\`). SBOM: soundings-$RELEASE_VERSION.cdx.json (CycloneDX). Chart: soundings-$RELEASE_VERSION.tgz."

# The production gate: a manual job on the protected vX.Y.Z tag that deploys the digest
# staging ran. GitLab Free: only people allowed to create the protected v* tag can run it.
# Premium: also protect the environment "production" with approval rules (the job then
# waits for approval first). Same YAML on both tiers.
deploy:production:
  extends: .deploy
  stage: production
  needs:
    - job: deploy:staging
  rules:
    - if: $SOUNDINGS_DEPLOY =~ /\bproduction\b/ && $SOUNDINGS_DEPLOY =~ /\bstaging\b/ && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: false
  manual_confirmation: Deploy this release to production? Staging runs the same image.
  environment:
    name: production
    url: $PRODUCTION_URL
    deployment_tier: production
  resource_group: production
  variables:
    KUBE_CONTEXT: ${KUBE_AGENT_PROJECT}:soundings-production
    DEPLOY_URL: ${PRODUCTION_URL}
  script:
    - IMAGE_DIGEST="$STAGED_IMAGE_DIGEST" IMAGE_TAG="$STAGED_IMAGE_TAG" scripts/deploy.sh deploy production

# A manual rollback of production (same gate as the deploy: a protected tag's pipeline,
# and on Premium the protected environment).
rollback:production:
  extends: .deploy
  stage: production
  needs: []
  rules:
    - if: $SOUNDINGS_DEPLOY =~ /\bproduction\b/ && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: true
  environment:
    name: production
    action: access
  resource_group: production
  variables:
    KUBE_CONTEXT: ${KUBE_AGENT_PROJECT}:soundings-production
    DEPLOY_URL: ${PRODUCTION_URL}
  script:
    - scripts/deploy.sh rollback production
