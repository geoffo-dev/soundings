# Values for the local k3s cluster (scripts/k3s-install.sh, make k3s-install).
# The image is imported straight into the node (scripts/k3s-load-image.sh), never pulled.
image:
  repository: soundings
  tag: dev
  pullPolicy: Never

# k3s-install.sh overrides this with http://localhost:$K3S_HTTP_PORT.
baseUrls:
  - http://localhost:18081

# Dev-only login stub, so the app is usable without Keycloak, and the demo data
# (hook Job running `soundings seed`; a no-op once the database has projects).
devLogin: true
demo:
  seed: true
logLevel: DEBUG

ingress:
  enabled: true
  className: traefik

# The smoke tests (scripts/public-smoke.sh) and demos send the public form from one
# address; the app's default is 10 an hour. (scripts/k3s-install.sh also puts a Traefik
# rate limit in front of /api/v1/public: dev/k3s/public-ratelimit.yaml.)
publicSubmission:
  perIpPerHour: 100

postgresql:
  persistence:
    size: 1Gi

api:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
worker:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
