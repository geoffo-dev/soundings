# Mailpit for the local k3s cluster (dev only): catches every email the release sends.
# Applied by scripts/k3s-mailpit.sh, which fills in __IMAGE__. No persistence: the
# messages live in the pod (an emptyDir), so scaling to 0 and back starts empty.
#
#   SMTP  mailpit.mailpit.svc.cluster.local:1025 (plain, any or no credentials):
#         dev/k3s-smtp-values.yaml points the release at it (make k3s-install SMTP=1)
#   UI    http://mailpit.localhost:<K3S_HTTP_PORT>/ through the ingress (*.localhost is
#         loopback on the host), with the API under /api/v1 (messages, search, ...)
apiVersion: v1
kind: Namespace
metadata:
  name: mailpit
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10025
        runAsGroup: 10025
        fsGroup: 10025
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: MP_DATABASE
              value: /data/mailpit.db
            - name: MP_MAX_MESSAGES
              value: "5000"
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
            - name: MP_DISABLE_VERSION_CHECK
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  namespace: mailpit
spec:
  ingressClassName: traefik
  rules:
    - host: mailpit.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  name: http
