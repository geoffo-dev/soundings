{% extends "_layout.html" %}
{% block content %}
<h1 class="sx-text" style="{{ s.h1 }}color:{{ c.text }};">Your idea is now {{ status }}</h1>
<p class="sx-text" style="{{ s.p }}color:{{ c.text }};">The idea you sent to {{ project }}, <strong>{{ title }}</strong>, is now <strong>{{ status }}</strong>.</p>
{% if tracking_url %}<p class="sx-text" style="{{ s.p }}color:{{ c.text }};">Don't want these emails? <a class="sx-link" href="{{ tracking_url }}" style="color:{{ c.link }};">Stop these emails</a> on your private tracking page.</p>{% endif %}
{% endblock %}
