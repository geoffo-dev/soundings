# One deploy job (reusable): scripts/deploy.sh on a self-hosted runner inside the network,
# for ci.yml (staging after the checks, production after staging) and deploy.yml (by hand).
# docs/operator-guide.md "Continuous delivery" has the runners, environments and variables.
#
# Cluster access: KUBECONFIG_DATA, an environment secret ("staging", "production") holding
# a kubeconfig with a token of a ServiceAccount bound to soundings-deployer in
# soundings-<env> only (deploy/ci/arc-rbac.yaml, scripts/lib/ci-kubeconfig.sh). GitHub
# releases it only to jobs that passed the environment's rules (its branches and tags,
# reviewers where the plan has them). The runner pods themselves get no cluster rights: any
# workflow on any branch can ask for a runner label, so a label is not access control
# (below Enterprise, whose runner groups can be limited to this workflow). KUBE_CONTEXT
# names a context of a kubeconfig the runner already has instead (an environment variable).
name: deploy-env

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        type: string
        required: true
      operation:
        description: deploy or rollback
        type: string
        default: deploy
      image_repository:
        type: string
        default: ""
      image_digest:
        type: string
        default: ""
      image_tag:
        type: string
        default: ""
      revision:
        description: rollback target (empty = the revision before the current one)
        type: string
        default: ""
      force:
        description: DEPLOY_FORCE (roll back across a migration boundary)
        type: boolean
        default: false
    secrets:
      # A repository secret, passed by the callers (an environment's CI_BUILD_CA wins).
      CI_BUILD_CA:
        required: false
      # The environment's secret (see above): GitHub uses the environment's, never one a
      # caller passes; declared so linters know it.
      KUBECONFIG_DATA:
        required: false
    outputs:
      image_repository:
        value: ${{ jobs.deploy.outputs.image_repository }}
      image_digest:
        value: ${{ jobs.deploy.outputs.image_digest }}
      image_tag:
        value: ${{ jobs.deploy.outputs.image_tag }}

permissions: {}

jobs:
  deploy:
    name: ${{ inputs.operation }} ${{ inputs.environment }}
    runs-on: ${{ inputs.environment == 'production' && (vars.SOUNDINGS_PRODUCTION_RUNNER || 'soundings-production') || (vars.SOUNDINGS_STAGING_RUNNER || 'soundings-staging') }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    # Never cancel a running helm upgrade. A group holds one running and one pending job and
    # a newer pending one replaces the older, which is right for main's deploys only: a
    # release's staging deploy and a rollback get groups of their own, and scripts/deploy.sh
    # waits for another deploy of the environment that is still running (and refuses one
    # from an older run than the release that is there).
    concurrency:
      group: soundings-deploy-${{ inputs.environment }}${{ inputs.operation == 'rollback' && '-rollback' || (github.ref_type == 'tag' && '-release' || '') }}
      cancel-in-progress: false
    permissions:
      contents: read
    # About 7 x HELM_TIMEOUT (waiting for another deploy, upgrade, test, rollback) at most.
    timeout-minutes: 90
    outputs:
      image_repository: ${{ inputs.image_repository }}
      image_digest: ${{ inputs.image_digest }}
      image_tag: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/deploy.sh ${{ inputs.operation }} ${{ inputs.environment }}
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK_REVISION: ${{ inputs.revision }}
          DEPLOY_FORCE: ${{ inputs.force && '1' || '0' }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          # Site values on top of (or instead of) deploy/environments/<env>.values.yaml, as
          # the GitLab CI/CD variable of the same name (environment variables; empty = default).
          DEPLOY_VALUES: ${{ vars.DEPLOY_VALUES }}
          HELM_TIMEOUT: ${{ vars.HELM_TIMEOUT }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
          KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT }}
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
          CI_BUILD_CA: ${{ secrets.CI_BUILD_CA }}
        run: |
          case "$OPERATION" in deploy | rollback) ;; *) echo "::error::operation must be deploy or rollback"; exit 1 ;; esac
          if [ -n "$CI_BUILD_CA" ]; then
            # An internal CA for the environment's URL (the smoke test): a full bundle.
            printf '%s\n' "$CI_BUILD_CA" > "$RUNNER_TEMP/ca.pem"
            export CURL_CA_BUNDLE="$RUNNER_TEMP/ca.pem"
          fi
          scripts/deploy.sh "$OPERATION" "$ENVIRONMENT"
