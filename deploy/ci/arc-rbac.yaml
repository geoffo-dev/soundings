# GitHub Actions deploy identities (docs/operator-guide.md "Continuous delivery"). Apply
# after deploy/environments/cluster-setup.yaml:
#
#   kubectl apply -f deploy/ci/arc-rbac.yaml
#
# Staging: the runner pods of the ARC scale set "soundings-staging" run as this
# ServiceAccount (arc-values.yaml: template.spec.serviceAccountName), which may deploy
# into soundings-staging only. GitHub stores nothing.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-soundings-staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soundings-deployer
  namespace: arc-soundings-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soundings-deployer-github-runner
  namespace: soundings-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: soundings-deployer
subjects:
  - kind: ServiceAccount
    name: soundings-deployer
    namespace: arc-soundings-staging
---
# Production: the runner pods of "soundings-production" get no rights at all (ARC's own
# no-permission ServiceAccount), because below GitHub Enterprise any workflow of the
# repository could target that runner. The deploy authenticates with a token of this
# ServiceAccount instead, kept in the "production" environment's secret KUBECONFIG_DATA,
# which GitHub releases only to jobs that passed the environment's rules (v* tags,
# reviewers where the plan has them). Mint it (and again before it expires):
#   kubectl -n soundings-production create token soundings-ci-deployer --duration=720h
apiVersion: v1
kind: Namespace
metadata:
  name: arc-soundings-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soundings-ci-deployer
  namespace: soundings-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soundings-deployer-github
  namespace: soundings-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: soundings-deployer
subjects:
  - kind: ServiceAccount
    name: soundings-ci-deployer
    namespace: soundings-production
