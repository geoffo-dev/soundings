# GitHub Actions deploy identities (docs/operator-guide.md "Continuous delivery"). Apply
# after deploy/environments/cluster-setup.yaml:
#
#   kubectl apply -f deploy/ci/arc-rbac.yaml
#
# The runner pods of the ARC scale sets "soundings-staging" and "soundings-production" get
# no cluster rights at all (ARC's own no-permission ServiceAccount): any workflow on any
# branch of the repository can ask for a runner label, so a label is not access control
# (below GitHub Enterprise, whose runner groups can be limited to deploy-env.yml). The
# deploy authenticates instead with a token of soundings-ci-deployer, bound to
# soundings-deployer in its environment's namespace only, kept in that GitHub
# environment's secret KUBECONFIG_DATA: GitHub releases it only to jobs that passed the
# environment's rules (staging: main and v* tags; production: v* tags, reviewers where the
# plan has them). Mint it, and again before it expires (30 days):
#
#   scripts/lib/ci-kubeconfig.sh staging      # and production; prints KUBECONFIG_DATA
apiVersion: v1
kind: Namespace
metadata:
  name: arc-soundings-staging
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-soundings-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soundings-ci-deployer
  namespace: soundings-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soundings-deployer-github
  namespace: soundings-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: soundings-deployer
subjects:
  - kind: ServiceAccount
    name: soundings-ci-deployer
    namespace: soundings-staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: soundings-ci-deployer
  namespace: soundings-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: soundings-deployer-github
  namespace: soundings-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: soundings-deployer
subjects:
  - kind: ServiceAccount
    name: soundings-ci-deployer
    namespace: soundings-production
