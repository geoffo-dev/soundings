# Production-like install: external database, ingress with TLS, SSO, SMTP from an
# existing Secret, HPA, NetworkPolicy and ServiceMonitor. Secrets referenced here are
# created out of band (e.g. by External Secrets or sealed-secrets).
global:
  imageRegistry: registry.internal.example.com

image:
  repository: platform/soundings
  tag: "0.2.0"
  pullSecrets:
    - regcred

baseUrls:
  - https://ideas.example.com
  - https://ideas.example.org

logLevel: INFO

secretKey:
  existingSecret: soundings-app
  existingSecretKey: secret-key

oidc:
  issuer: https://login.example.com/realms/example
  clientId: soundings
  existingSecret: soundings-oidc
  groupsClaim: groups
  externalIdClaim: employee_no

smtp:
  host: smtp.example.com
  port: 587
  security: starttls
  existingSecret: soundings-smtp
  from: ideas@example.com
  fromName: Example Ideas
  replyTo: innovation@example.com
  caBundle:
    configMap: corporate-ca
    key: ca.crt
  timeout: 15

breakGlass:
  enabled: true
  existingSecret: soundings-break-glass

features:
  publicSubmission: true
  ai: false

publicSubmission:
  perIpPerHour: 5
  perProjectPerHour: 200
  altcha:
    cost: 20000
    expiry: PT15M

branding:
  maxUploadBytes: 262144

otel:
  endpoint: http://otel-collector.observability:4318

postgresql:
  enabled: false

externalDatabase:
  host: soundings-db-rw.databases.svc
  port: 5432
  database: soundings
  user: soundings
  existingSecret: soundings-db-app
  existingSecretPasswordKey: password
  sslmode: verify-full

extraVolumes:
  - name: db-ca
    secret:
      secretName: soundings-db-ca
extraVolumeMounts:
  - name: db-ca
    mountPath: /etc/soundings/db-ca
    readOnly: true
extraEnv:
  - name: PGSSLROOTCERT
    value: /etc/soundings/db-ca/ca.crt

api:
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 1Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: soundings
          app.kubernetes.io/component: api

worker:
  replicas: 2
  concurrency: 8

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  annotations:
    # The app refuses bodies over 1 MiB itself (413); refuse them at the edge too.
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    cert-manager.io/cluster-issuer: letsencrypt
  # An edge rate limit for the anonymous form's API only (a second Ingress).
  publicApi:
    annotations:
      nginx.ingress.kubernetes.io/limit-rpm: "30"
      nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
  tls:
    - secretName: soundings-tls
      hosts:
        - ideas.example.com
        - ideas.example.org

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
