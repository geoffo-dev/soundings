# kagent in its own namespace (admitted by the API's NetworkPolicy next to the ingress
# controller, with its agent pods in the release namespace), AI runs on, the example
# agents (evaluator and researcher, each with its own RemoteMCPServer and key Secret)
# plus the shared RemoteMCPServer of Phase 5, and an allow-list on the /mcp Ingress.
baseUrls:
  - https://ideas.example.com
ingress:
  enabled: true
  className: nginx
  tls:
    - secretName: soundings-tls
      hosts: [ideas.example.com]
  mcp:
    annotations:
      nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.0.2.0/24"
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
features:
  ai: true
kagent:
  enabled: true
  namespace: kagent
  examples: true
  mcp:
    keySecret: soundings-agent-key
    timeout: 45s
  agents:
    modelConfig: soundings-model
    researcher:
      keySecret: researcher-key
      keySecretKey: header
