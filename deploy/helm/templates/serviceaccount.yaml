{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "soundings.serviceAccountName" . }}
  labels:
    {{- include "soundings.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Soundings does not call the Kubernetes API (kagent runs are reached over HTTP).
automountServiceAccountToken: false
{{- end }}
