{{- /*
Bundled PostgreSQL: one replica, for dev and small installs. Regular release resources
(not hooks), so upgrades and uninstalls manage them normally; the PersistentVolumeClaim
from volumeClaimTemplates is kept on uninstall.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $pg := .Values.postgresql }}
{{- $name := include "soundings.postgresql.fullname" . }}
{{- if not $pg.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
type: Opaque
data:
  {{- if $pg.auth.password }}
  password: {{ $pg.auth.password | b64enc }}
  {{- else }}
  password: {{ include "soundings.lookupOrGenerate" (dict "ctx" . "name" $name "key" "password" "length" 32) }}
  {{- end }}
  # The bootstrap superuser "postgres" (maintenance from inside the pod only).
  admin-password: {{ include "soundings.lookupOrGenerate" (dict "ctx" . "name" $name "key" "admin-password" "length" 32) }}
---
{{- end }}
{{- /*
Security review P7 L6: the app's role is not a superuser. initdb creates the bootstrap
superuser "postgres"; this script (run once, on an empty data directory) creates the
app's login role and gives it the database and its public schema, which is all
migrations, procrastinate's schema and the trusted pg_trgm extension need. A data
directory initialised by an earlier chart keeps its roles (operator guide, "Bundled
Postgres vs external or CloudNativePG database").
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
data:
  10-app-role.sh: |
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -v app_user="$SOUNDINGS_DB_USER" -v app_password="$SOUNDINGS_DB_PASSWORD" \
      -v db="$POSTGRES_DB" <<'SQL'
    CREATE ROLE :"app_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
      PASSWORD :'app_password';
    ALTER DATABASE :"db" OWNER TO :"app_user";
    ALTER SCHEMA public OWNER TO :"app_user";
    REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
    GRANT CONNECT, TEMPORARY ON DATABASE :"db" TO :"app_user";
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      # Not the version and chart labels: the database must not restart whenever the app's
      # image changes (every deploy).
      labels:
        {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 8 }}
        app.kubernetes.io/part-of: soundings
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      # Service links would inject SOUNDINGS_PORT=tcp://... for a Service named "soundings".
      enableServiceLinks: false
      securityContext:
        {{- toYaml $pg.podSecurityContext | nindent 8 }}
      {{- with (include "soundings.imagePullSecrets" . | trim) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: postgresql
          image: {{ include "soundings.postgresql.image" . }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ $pg.auth.database | quote }}
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundings.postgresql.secretName" . }}
                  key: {{ $pg.auth.existingSecretAdminKey }}
            # The app's own role, created by the init script (not a superuser).
            - name: SOUNDINGS_DB_USER
              value: {{ $pg.auth.username | quote }}
            - name: SOUNDINGS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundings.postgresql.secretName" . }}
                  key: {{ include "soundings.postgresql.secretKey" . }}
            # A subdirectory, so initdb does not trip over the volume's lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      terminationGracePeriodSeconds: 60
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not $pg.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with (include "soundings.scheduling" . | trim) }}{{ . | nindent 6 }}{{ end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $pg.persistence.accessModes | nindent 10 }}
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
{{- end }}
