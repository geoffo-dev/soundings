apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soundings.fullname" . }}-api
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soundings.podLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "soundings.serviceAccountName" . }}
      automountServiceAccountToken: false
      # Service links would inject SOUNDINGS_PORT=tcp://... for a Service named "soundings".
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (include "soundings.imagePullSecrets" . | trim) }}{{ . | nindent 6 }}{{ end }}
      {{- with (include "soundings.appInitContainers" . | trim) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: api
          image: {{ include "soundings.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["api"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          envFrom:
            {{- include "soundings.envFrom" . | nindent 12 }}
          env:
            {{- include "soundings.secretEnv" (dict "ctx" . "signIn" true) | nindent 12 }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "soundings.volumeMounts" . | nindent 12 }}
      # uvicorn drains in-flight requests for up to 20 s on SIGTERM.
      terminationGracePeriodSeconds: 30
      volumes:
        {{- include "soundings.volumes" . | nindent 8 }}
      {{- with (include "soundings.scheduling" . | trim) }}{{ . | nindent 6 }}{{ end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
