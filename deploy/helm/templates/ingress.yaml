{{- if .Values.ingress.enabled }}
{{- $hosts := .Values.ingress.hosts | default (include "soundings.baseHosts" . | fromYamlArray) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "soundings.fullname" . }}
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "soundings.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.features.publicSubmission .Values.ingress.publicApi.annotations }}
{{- $hosts := .Values.ingress.hosts | default (include "soundings.baseHosts" . | fromYamlArray) }}
---
# The public form's API (anonymous submissions, tracking, email confirmation) with its
# own annotations, e.g. an edge rate limit. The longer path wins over "/" above. Only
# ingress.publicApi.annotations apply here (not ingress.annotations, so cert-manager
# doesn't see two Ingresses claiming one certificate); the TLS block is the same.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "soundings.fullname" . }}-public
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.publicApi.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api/v1/public
            pathType: Prefix
            backend:
              service:
                name: {{ include "soundings.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.mcp.annotations }}
{{- $hosts := .Values.ingress.hosts | default (include "soundings.baseHosts" . | fromYamlArray) }}
---
# The MCP server (/mcp: MCP clients and AI agents with an API key) with its own
# annotations, e.g. an allow-list of client networks. A Prefix path, so it wins over "/"
# above everywhere (Traefik ranks routers by rule length, and an Exact /mcp rule is
# shorter than PathPrefix(`/`)); only ingress.mcp.annotations apply here (as for the
# public form's Ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "soundings.fullname" . }}-mcp
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.mcp.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "soundings.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
