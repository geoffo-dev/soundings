{{- if .Values.ingress.enabled }}
{{- $hosts := .Values.ingress.hosts | default (include "soundings.baseHosts" . | fromYamlArray) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "soundings.fullname" . }}
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "soundings.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
