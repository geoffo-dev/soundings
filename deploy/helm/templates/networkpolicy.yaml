{{- /*
Ingress-only policies: the API accepts traffic on its HTTP port (from ingressFrom /
metricsFrom peers, or anyone when ingressFrom is empty), the worker accepts nothing,
and the bundled Postgres only accepts this release's app pods. Egress stays open
(IdP, SMTP, kagent and the database live in different places in every cluster).
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "soundings.fullname" . }}-api
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- with .Values.networkPolicy.metricsFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "soundings.selectorLabels" . | nindent 14 }}
      {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "soundings.fullname" . }}-worker
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "soundings.postgresql.fullname" . }}
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: postgresql
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "soundings.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, migrate]
{{- end }}
{{- end }}
