{{- /*
Ingress: the API accepts traffic on its HTTP port from ingressFrom peers (plus, when
kagent.enabled, kagent's namespace, whose controller lists the MCP tools, and kagent's
agent pods, label app.kubernetes.io/managed-by: kagent, in kagent.agentNamespaces, which
call /mcp) and on its metrics port from metricsFrom peers (each: anyone when
the list is empty; this release's pods always), the worker accepts nothing, and the
bundled Postgres only accepts this release's app pods and Jobs.
Egress (networkPolicy.egress.enabled, off by default: IdP, SMTP, kagent and the
database live in different places in every cluster): the api and worker pods reach
only DNS, the database and their own destinations ("soundings.egressRules").
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $egress := .Values.networkPolicy.egress.enabled }}
{{- $httpFrom := .Values.networkPolicy.ingressFrom }}
{{- if and $httpFrom .Values.kagent.enabled }}
{{- $httpFrom = append $httpFrom (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Values.kagent.namespace))) }}
{{- /* kagent's agent pods call /mcp from their own namespace, not the controller's. */}}
{{- range (include "soundings.agentNamespaces" . | splitList ",") }}
{{- if ne . $.Values.kagent.namespace }}
{{- $httpFrom = append $httpFrom (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .)) "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/managed-by" "kagent"))) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "soundings.fullname" . }}-api
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress }}
    - Egress
  egress:
    {{- include "soundings.egressRules" (dict "ctx" . "component" "api") | nindent 4 }}
    {{- end }}
  ingress:
    {{- range $port, $peers := dict "http" $httpFrom "metrics" .Values.networkPolicy.metricsFrom }}
    - ports:
        - port: {{ $port }}
          protocol: TCP
      {{- if $peers }}
      from:
        {{- toYaml $peers | nindent 8 }}
        - podSelector:
            matchLabels:
              {{- include "soundings.selectorLabels" $ | nindent 14 }}
      {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "soundings.fullname" . }}-worker
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress }}
    - Egress
  egress:
    {{- include "soundings.egressRules" (dict "ctx" . "component" "worker") | nindent 4 }}
    {{- end }}
  ingress: []
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "soundings.postgresql.fullname" . }}
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: postgresql
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "soundings.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, migrate, seed]
{{- end }}
{{- end }}
