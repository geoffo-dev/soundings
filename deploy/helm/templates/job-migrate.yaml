{{- /*
Schema migrations as a hook Job, for an external database (it exists before the release).
With the bundled Postgres the api/worker pods migrate in an init container instead,
because a pre-install hook would run before the StatefulSet exists (README "Migrations").

Hooks run before the release's own ConfigMap, Secret and ServiceAccount exist, so the
Job carries its settings inline, reads secrets from existingSecrets or from the hook
Secret below, and runs under the namespace's default ServiceAccount (no token mounted).
*/ -}}
{{- if not .Values.postgresql.enabled }}
{{- $fullname := include "soundings.fullname" . }}
{{- $hookSecret := printf "%s-migrate" $fullname }}
{{- $needsHookSecret := or (not .Values.secretKey.existingSecret) (and (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.password) }}
{{- if $needsHookSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $hookSecret }}
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
type: Opaque
data:
  {{- if not .Values.secretKey.existingSecret }}
  # Migrations never use the key; production settings only require one to be present.
  secret-key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
  {{- if and (not .Values.externalDatabase.existingSecret) .Values.externalDatabase.password }}
  database-password: {{ .Values.externalDatabase.password | b64enc }}
  {{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-migrate
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "soundings.podLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if not .Values.serviceAccount.create }}
      serviceAccountName: {{ include "soundings.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: false
      # Service links would inject SOUNDINGS_PORT=tcp://... for a Service named "soundings".
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (include "soundings.imagePullSecrets" . | trim) }}{{ . | nindent 6 }}{{ end }}
      initContainers:
        - name: wait-for-db
          image: {{ include "soundings.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- include "soundings.waitForDatabaseCommand" . | nindent 12 }}
          env:
            {{- include "soundings.migrateEnv" . | trim | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "soundings.migrateVolumeMounts" . | nindent 12 }}
      containers:
        - name: migrate
          image: {{ include "soundings.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "soundings.migrateEnv" . | trim | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "soundings.migrateVolumeMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (include "soundings.scheduling" . | trim) }}{{ . | nindent 6 }}{{ end }}
{{- end }}
