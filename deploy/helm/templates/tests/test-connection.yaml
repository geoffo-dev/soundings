apiVersion: v1
kind: Pod
metadata:
  name: {{ include "soundings.fullname" . }}-test-connection
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Kept after success so `helm test --logs` can read it; replaced on the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with (include "soundings.imagePullSecrets" . | trim) }}{{ . | nindent 2 }}{{ end }}
  containers:
    # Uses the app image (already present, works air-gapped) as an HTTP client.
    - name: check
      image: {{ include "soundings.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        # The app only answers hosts listed in baseUrls (except /healthz, /readyz, /mcp), so
        # requests carry the first base URL's host, as the ingress would send it.
        # Retried for up to 30 s: a NetworkPolicy controller (k3s's kube-router, Calico…)
        # may admit a new pod's address a moment after the pod starts.
        - |
          import sys, time, urllib.error, urllib.request
          base, host = sys.argv[1], sys.argv[2]
          def get(path):
              for attempt in range(30):
                  try:
                      request = urllib.request.Request(base + path, headers={"Host": host})
                      return urllib.request.urlopen(request, timeout=10)
                  except OSError as error:
                      if attempt == 29:
                          raise
                      print(path, "not reachable yet:", error)
                      time.sleep(1)
          for path, expected in (("/readyz", "application/json"), ("/", "text/html")):
              with get(path) as response:
                  kind = response.headers.get("content-type", "")
                  print(path, response.status, kind)
                  if response.status != 200 or not kind.startswith(expected):
                      sys.exit(f"unexpected response for {path}")
          # The MCP server, as an in-cluster agent calls it: the Service's own host name
          # (/mcp is exempt from the Host check), no key -> 401 asking for a bearer key.
          request = urllib.request.Request(
              base + "/mcp", method="POST", data=b'{"jsonrpc":"2.0","id":1,"method":"ping"}',
              headers={"Content-Type": "application/json",
                       "Accept": "application/json, text/event-stream"})
          try:
              urllib.request.urlopen(request, timeout=10)
              sys.exit("/mcp answered without an API key")
          except urllib.error.HTTPError as error:
              kind = error.headers.get("content-type", "")
              challenge = error.headers.get("www-authenticate", "")
              print("/mcp", error.code, kind, challenge)
              if error.code != 401 or not kind.startswith("application/problem+json") \
                      or not challenge.startswith("Bearer"):
                  sys.exit("unexpected response for /mcp without a key")
        - {{ printf "http://%s:%v" (include "soundings.fullname" .) .Values.service.port | quote }}
        - {{ (urlParse (first .Values.baseUrls)).host | quote }}
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        sizeLimit: 16Mi
