{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "soundings.fullname" . }}-api
  labels:
    {{- include "soundings.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "soundings.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
{{- end }}
