# The app's own secrets, generated once in the cluster (refreshInterval "0": never
# regenerated; deleting the Secret makes a new one). Changing soundings-app's key signs
# everyone out and invalidates unsubscribe and tracking links.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: soundings-secret
  namespace: soundings-staging
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# soundings-app: secretKey.existingSecret (key secret-key, 32+ characters).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: soundings-app
  namespace: soundings-staging
spec:
  refreshInterval: "0"
  target:
    name: soundings-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        secret-key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: soundings-secret
---
# soundings-oidc: oidc.existingSecret (key client-secret). Crossplane gives the same value
# to the Keycloak client (keycloak.yaml, clientSecretSecretRef).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: soundings-oidc
  namespace: soundings-staging
spec:
  refreshInterval: "0"
  target:
    name: soundings-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: soundings-secret
---
# soundings-break-glass: breakGlass.existingSecret (keys username, password: 16+). Unused
# while oidc.issuer is set (break-glass works only without SSO), but the pods read it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: soundings-break-glass
  namespace: soundings-staging
spec:
  refreshInterval: "0"
  target:
    name: soundings-break-glass
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: soundings-secret
