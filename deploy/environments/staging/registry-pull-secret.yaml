# soundings-registry: the image pull Secret (image.pullSecrets). A .dockerconfigjson for
# GitLab deploy token 70 on user-research/soundings (read_registry, expires 2027-10-16)
# in AWS Secrets Manager; renew the token and the secret's value before then.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: soundings-registry
  namespace: soundings-staging
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: eks-secret-store-install
  target:
    name: soundings-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: faster/ops/gitlab/user-research-soundings-registry-token
