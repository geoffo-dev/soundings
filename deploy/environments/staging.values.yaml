# Staging: what scripts/deploy.sh deploys on every push to main (and on a vX.Y.Z tag before
# production). Production mode, like production, with smaller resources. On
# faster-ops-cluster behind the shared ALB, keycloak-v26 for SSO and a CloudNativePG database.
#
# No secrets here. The Secrets named below come from deploy/environments/staging/ (applied
# once by hand: External Secrets, CloudNativePG, Crossplane); the chart only references them
# and scripts/deploy.sh checks they exist before Helm runs. The image
# (registry, repository, tag, digest) is set by the deploy: don't set image.repository or
# global.imageRegistry here (scripts/deploy.sh refuses a values file that would change the
# image it was asked to deploy).

image:
  # docker-registry Secret to pull the image (GitLab: a deploy token with read_registry;
  # ghcr.io: a classic PAT with read:packages). Remove when nodes pull from a mirror that
  # needs no credentials.
  pullSecrets:
    - soundings-registry

baseUrls:
  - https://soundings-staging.ops.faster.ice.mod.gov.uk

logLevel: INFO

secretKey:
  existingSecret: soundings-app
  existingSecretKey: secret-key

# Sign-in: SSO against keycloak-v26's faster realm (break-glass only while issuer is empty).
# The client soundings-staging is Crossplane's (staging/keycloak.yaml).
oidc:
  issuer: https://keycloak.ops.faster.ice.mod.gov.uk/realms/faster
  clientId: soundings-staging
  existingSecret: soundings-oidc
  groupsClaim: groups

breakGlass:
  enabled: true
  existingSecret: soundings-break-glass

# No SMTP yet: notifications are in-app only (platform admins see "Email isn't set up").

timezone: Europe/London

# The migration hook Job (external database) ends before Helm gives up on the upgrade
# (HELM_TIMEOUT, 10m by default): scripts/deploy.sh refuses a deadline that doesn't, because
# a Job still running after Helm's rollback could migrate the database under the restored
# release. Raise both together for a long migration.
migrations:
  activeDeadlineSeconds: 480
  waitForDatabaseSeconds: 120

# CloudNativePG Cluster soundings-staging-db in this namespace (staging/database.yaml): its
# -rw Service and -app Secret. Migrations run in the pre-upgrade hook Job, as in production.
postgresql:
  enabled: false
externalDatabase:
  host: soundings-staging-db-rw.soundings-staging.svc
  port: 5432
  database: soundings
  user: soundings
  existingSecret: soundings-staging-db-app
  existingSecretPasswordKey: password
  sslmode: require

api:
  replicas: 1
worker:
  replicas: 1

# The shared internal ALB (AWS Load Balancer Controller, instance targets): TLS ends at
# the ALB with ACM's certificate, so no tls here; external-dns publishes the host.
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: shared-apps-alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    external-dns.alpha.kubernetes.io/ingress-hostname-source: defined-hosts-only

# Instance targets reach the pods through a NodePort from the nodes, which no namespace or
# pod selector matches: admit any source, and trust X-Forwarded-For only from the VPC
# (nodes and the ALB), never from pods (10.40.0.0/16), so a pod can't pick its client IP.
trustedProxies:
  - 10.1.196.0/22
trustedProxyHops: 1

networkPolicy:
  enabled: true
  ingressFrom: []
